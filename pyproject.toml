[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover"
version = "0.4.0"
description = "Pure-Python AI watermark remover for text, images, and documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohamed Elkholy"}]
keywords = [
    "watermark",
    "watermark-removal",
    "ai-detection",
    "c2pa",
    "provenance",
    "unicode",
    "steganography",
    "exif",
    "metadata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/PyModel/watermark-remover"
Repository = "https://github.com/PyModel/watermark-remover"
Issues = "https://github.com/PyModel/watermark-remover/issues"
Changelog = "https://github.com/PyModel/watermark-remover/releases"

[project.optional-dependencies]
visible = [
    "numpy",
    "Pillow",
    "opencv-python-headless",
]
quality = [
    "scikit-image",
]
ai = [
    "torch",
    "torchvision",
]
provenance = [
    "c2pa-python",
]
all = [
    "watermark-remover[visible]",
    "watermark-remover[quality]",
    "watermark-remover[ai]",
    "watermark-remover[provenance]",
]

[project.scripts]
wm = "watermark_remover.scripts.clean_file:main"
wm-serve = "watermark_remover.scripts.server:main"
wm-audit-dir = "watermark_remover.scripts.audit_dir:main"
wm-audit-site = "watermark_remover.scripts.audit_website:main"

[tool.setuptools]
# The on-disk directory keeps its Claude-skill layout (skills/remove-ai-marks);
# the installed package is a single top-level `watermark_remover` root. Mapping
# them here avoids claiming a generic `skills` namespace in site-packages.
package-dir = {"watermark_remover" = "skills/remove-ai-marks"}
packages = ["watermark_remover", "watermark_remover.scripts"]

[tool.setuptools.package-data]
# Ship the skill documentation and bootstrap assets so a wheel install is
# self-sufficient for the CLI surfaces that read them at runtime.
"watermark_remover" = ["SKILL.md", "references/*.md"]
"watermark_remover.scripts" = ["*.txt", "setup_*.sh", "setup_*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle + pyflakes core; I: import sorting; UP: pyupgrade;
# B: bugbear; SIM: simplify; RUF: ruff-specific; PLW: pylint warnings;
# S: bandit security checks (port parity with the upstream reference).
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF", "PLW", "S"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    # S101: asserts are idiomatic in this test suite.
    "S101",
    # S603: subprocess args are shell-free by construction (external_command
    # runs argv directly; no shell=True anywhere in the codebase).
    "S603",
]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"skills/remove-ai-marks/scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.watermark]
# Default settings — overridden by env vars and .env file.
max_file_size = 104857600
max_image_pixels = 40000000
max_concurrency = 4
log_level = "INFO"
rewrite_timeout = 120
max_rewrite_generations = 5
max_rewrite_population = 12
rewrite_backend = "print-prompt"
rewrite_base_url = "http://127.0.0.1:11434"
