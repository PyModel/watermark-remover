[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"skills/remove-ai-marks/scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
