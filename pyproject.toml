[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover"
version = "0.6.0"
description = "Pure-Python AI watermark remover for text, images, and documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohamed Elkholy"}]
keywords = [
    "watermark",
    "watermark-removal",
    "ai-detection",
    "c2pa",
    "provenance",
    "unicode",
    "steganography",
    "exif",
    "metadata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/PyModel/watermark-remover"
Repository = "https://github.com/PyModel/watermark-remover"
Issues = "https://github.com/PyModel/watermark-remover/issues"
Changelog = "https://github.com/PyModel/watermark-remover/releases"

[project.optional-dependencies]
visible = [
    "numpy",
    "Pillow",
    "opencv-python-headless",
]
# The `pixel` extra is the declared home for pixel-tier work (numpy, headless
# OpenCV, Pillow); `visible` remains a working superset alias.  See NOTICE and
# CONTRIBUTING.md for the porting provenance this extra backs.
pixel = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
]
quality = [
    "scikit-image",
]
# The open DWT-DCT detector (dwt_dct.py + invisible_watermark.py): numpy,
# headless OpenCV and PyWavelets decode the public invisible-watermark payloads
# (SD 1.x/2.x, SDXL, FLUX.2) locally with no oracle install. The
# invisible-watermark library itself is a dev-only fixture-generation tool and
# must never appear here (see assets/PROVENANCE.md).
detect = [
    "numpy",
    "opencv-python-headless",
    "PyWavelets",
]
# The abstaining OpenAI/Google/unknown source-export classifiers
# (source_classify.py + source_classify_v2.py + source_spectral.py +
# image_math.py) -- intentionally separate from the heavier photo
# AI-versus-camera classifier and NOT a SynthID detector. The pixel stack is
# the `pixel` extra's numpy + headless OpenCV + Pillow; huggingface_hub
# fetches the pinned weight revisions on first use (see assets/PROVENANCE.md
# for the recorded repo/revision/SHA-256 pins). Weights are never bundled in
# this repo; without them the classifiers abstain to `unknown`.
source-classify = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "huggingface-hub>=0.20.0,<2",
]
# The metadata-free photo classifier (classify.py + clip_l_ft.py): the frozen
# CLIP-L-ft Model 1 plus the gated provider head (Model 2). Same pixel stack
# as source-classify, plus torch + transformers for the freeze and
# huggingface-hub for the pinned weights snapshot on first use (see
# assets/PROVENANCE.md). Weights and the receipt-gate npz are never bundled;
# without them the verb reports unavailable -- labeled, never a silent pass.
# The classify verb is explicit-only: nothing auto-runs it.
classify = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "torch",
    "transformers",
    "huggingface-hub>=0.20.0,<2",
]
# The ONNX photo-classifier backend (classify.py --backend onnx): the classify
# stack by reference plus ONNX Runtime for the vision-only FP32 export.
classify-onnx = [
    "watermark-remover[classify]",
    "onnxruntime",
]
# The Adobe TrustMark decoder (trustmark_detector.py) -- the open, keyless
# watermark behind Adobe Durable Content Credentials (the Variant P soft
# binding; the dotted alg id stays unported, see tests/test_c2pa_carveout.py).
# Optional because it pulls torch via the trustmark
# pip package and downloads model weights on first use; the decoder entry in
# inspect_soft_binding guards the import and reports the finding only when this
# extra is installed. Standalone: it never joins `all` (torch stays opt-in).
trustmark = [
    # 0.9.2 dropped the NumPy <2 pin that kept earlier releases off CPython
    # 3.13+; the durability-gated detector vectors pass on 3.14 with NumPy 2.x.
    "trustmark>=0.9.2",
]
ai = [
    "torch",
    "torchvision",
]
provenance = [
    "c2pa-python",
]
# The learned ONNX fill tiers (ticket 04). Both probe onnxruntime + the
# Hugging Face hub client; the model weights download pinned to an audited
# commit at first use into the user's HF cache and are never bundled:
#   migan: andraniksargsyan/migan (MIT, ~28 MB)
#   lama:  Carve/LaMa-ONNX (Apache-2.0, ~200 MB)
migan = [
    "watermark-remover[pixel]",
    "onnxruntime>=1.20,<2",
    "huggingface-hub>=0.20,<2",
]
lama = [
    "watermark-remover[pixel]",
    "onnxruntime>=1.20,<2",
    "huggingface-hub>=0.20,<2",
]
all = [
    "watermark-remover[visible]",
    "watermark-remover[quality]",
    "watermark-remover[ai]",
    "watermark-remover[provenance]",
    "watermark-remover[detect]",
    "watermark-remover[source-classify]",
]

[project.scripts]
wm = "watermark_remover.scripts.clean_file:main"
wm-tui = "watermark_remover.scripts.tui:main"
wm-serve = "watermark_remover.scripts.server:main"
wm-audit-dir = "watermark_remover.scripts.audit_dir:main"
wm-audit-site = "watermark_remover.scripts.audit_website:main"

[tool.setuptools]
# The on-disk directory keeps its Claude-skill layout (skills/remove-ai-marks);
# the installed package is a single top-level `watermark_remover` root. Mapping
# them here avoids claiming a generic `skills` namespace in site-packages.
package-dir = {"watermark_remover" = "skills/remove-ai-marks"}
packages = ["watermark_remover", "watermark_remover.scripts"]

[tool.setuptools.package-data]
# Ship the skill documentation and bootstrap assets so a wheel install is
# self-sufficient for the CLI surfaces that read them at runtime.
# The wm-tui frontend ships as source; the launcher runs
# `bun install --frozen-lockfile --production` on first start (into a cache
# copy when site-packages is read-only). tsconfig.json ships so `tsc` can
# typecheck those sources; the launcher does not execute it.
"watermark_remover" = [
    "SKILL.md",
    "references/*.md",
    "tui/package.json",
    "tui/bun.lock",
    "tui/tsconfig.json",
    "tui/src/**/*",
    "tui/PROTOCOL.md",
    # The web UI ships prebuilt (wm-serve serves web/dist at /); users never need Bun for it.
    "web/dist/*",
]
"watermark_remover.scripts" = ["*.txt", "setup_*.sh", "setup_*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle + pyflakes core; I: import sorting; UP: pyupgrade;
# B: bugbear; SIM: simplify; RUF: ruff-specific; PLW: pylint warnings;
# S: bandit security checks (port parity with the upstream reference).
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF", "PLW", "S"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    # S101: asserts are idiomatic in this test suite.
    "S101",
    # S603: subprocess args are shell-free by construction (external_command
    # runs argv directly; no shell=True anywhere in the codebase).
    "S603",
]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"skills/remove-ai-marks/scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.watermark]
# Default settings — overridden by env vars and .env file.
max_file_size = 104857600
max_image_pixels = 40000000
max_concurrency = 4
log_level = "INFO"
rewrite_timeout = 120
max_rewrite_generations = 5
max_rewrite_population = 12
rewrite_backend = "print-prompt"
rewrite_base_url = "http://127.0.0.1:11434"
