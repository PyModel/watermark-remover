[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover"
version = "0.3.0"
description = "Pure-Python AI watermark remover for text, images, and documents"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohamed Elkholy"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
visible = [
    "numpy",
    "Pillow",
    "opencv-python-headless",
]
quality = [
    "scikit-image",
]
ai = [
    "torch",
    "torchvision",
]
provenance = [
    "c2pa-python",
]
all = [
    "watermark-remover[visible]",
    "watermark-remover[quality]",
    "watermark-remover[ai]",
    "watermark-remover[provenance]",
]

[project.scripts]
wm = "skills.remove_ai_marks.scripts.clean_file:main"

[tool.setuptools]
# The on-disk directory uses a hyphen (skills/remove-ai-marks) while the
# importable package uses an underscore; map them explicitly.
package-dir = {"skills.remove_ai_marks" = "skills/remove-ai-marks"}
packages = ["skills.remove_ai_marks", "skills.remove_ai_marks.scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"skills/remove-ai-marks/scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.watermark]
# Default settings — overridden by env vars and .env file.
max_file_size = 104857600
max_image_pixels = 40000000
max_concurrency = 4
log_level = "INFO"
rewrite_timeout = 120
max_rewrite_generations = 5
max_rewrite_population = 12
rewrite_backend = "print-prompt"
rewrite_base_url = "http://127.0.0.1:11434"
