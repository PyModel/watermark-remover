name: Latest dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Latest supported Python dependencies + locked TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - name: Upgrade within declared supported dependency ranges
        run: python -m pip install --upgrade -r requirements-test.txt
      - run: make check tui-check
