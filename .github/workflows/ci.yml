name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Compile
        run: python -m compileall -q skills/remove-ai-marks/scripts demo.py

      - name: Test
        run: python -m pytest -q

      - name: Full check (lint, format, compile, test, smoke)
        run: make check PYTHON=python
