name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: make lint format-check compile
      - name: Install and run actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.7 --repo rhysd/actionlint \
            --pattern actionlint_1.7.7_linux_amd64.tar.gz \
            --pattern actionlint_1.7.7_checksums.txt \
            --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint"

  test:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Validate OpenAPI specification
        run: >-
          python -c "from pathlib import Path; import sys;
          sys.path.insert(0, str(Path('skills/remove-ai-marks/scripts').resolve()));
          from server import openapi_spec; from openapi_spec_validator import validate;
          validate(openapi_spec())"

  tui:
    name: TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: make tui-check

  verify:
    name: Independent cleaning verification
    needs: [lint, test, tui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: make smoke verify

  packaging:
    name: Installed-wheel gate
    needs: [lint, test, tui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: python -m pip install -r requirements-test.txt
      - name: Build, install and verify release artifacts
        env:
          WM_PACKAGING_DIST: dist
        run: make packaging
      - run: python -m pip install twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt pip-audit
      - run: python -m pip_audit

  ci:
    name: CI gate
    if: always()
    needs: [lint, test, tui, verify, packaging, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          print(failed or 'All gates passed')
          sys.exit(bool(failed))
          PY
