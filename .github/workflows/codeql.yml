name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  # Required for CodeQL to upload SARIF results.
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: ${{ matrix.language }}
          # The default code-scanning suite excludes kind: alert-suppression
          # queries, so in-source "# codeql[...] suppress" comments are never
          # stamped into the SARIF and every flagged line stays a counted
          # alert. Adding the suppression query makes each alert whose line a
          # suppression comment cites carry {kind: inSource}, which is how a
          # commented guard is honored instead of re-raised on every push.
          queries: codeql/python-queries:AlertSuppression.ql
      - uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
