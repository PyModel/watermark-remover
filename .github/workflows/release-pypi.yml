name: PyPI Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified distribution
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Verify tag against the tested wheel
        run: |
          python - <<'PY'
          import email, os, pathlib, zipfile
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1, 'Expected exactly one verified wheel'
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
              assert len(metadata_files) == 1, 'Expected one package metadata record'
              metadata = email.message_from_bytes(archive.read(metadata_files[0]))
          assert metadata['Name'] == 'watermark-remover'
          assert metadata['Version'] == os.environ['GITHUB_REF_NAME'].removeprefix('v'), 'Tag/version mismatch'
          PY
      - name: Publish wheel and sdist using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: GitHub release after publication
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Attach the verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
