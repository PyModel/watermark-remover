<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="wr-icon-title wr-icon-desc">
  <title id="wr-icon-title">watermark-remover</title>
  <desc id="wr-icon-desc">Dark rounded square. Four rows of signal are consumed left to right by a scrub line: cleaned residue behind it, live marks ahead of it.</desc>

  <rect width="128" height="128" rx="26" fill="#0F1110"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="25.5" fill="none" stroke="#232825"/>

  <!-- cleaned residue, behind the scrub line -->
  <g fill="#333833">
    <rect x="26" y="35" width="44" height="8" rx="4"/>
    <rect x="26" y="53" width="44" height="8" rx="4"/>
    <rect x="26" y="71" width="44" height="8" rx="4"/>
    <rect x="26" y="89" width="44" height="8" rx="4"/>
  </g>

  <!-- live marks, ahead of the scrub line -->
  <g fill="#E8A33D">
    <rect x="74" y="35" width="28" height="8" rx="4"/>
    <rect x="74" y="53" width="28" height="8" rx="4"/>
    <rect x="74" y="71" width="28" height="8" rx="4"/>
    <rect x="74" y="89" width="10" height="8" rx="4"/>
  </g>

  <!-- scrub line -->
  <rect x="70" y="24" width="4" height="80" fill="#E8A33D"/>
  <rect x="64" y="20" width="16" height="4" fill="#E8A33D"/>
  <rect x="64" y="104" width="16" height="4" fill="#E8A33D"/>
</svg>
