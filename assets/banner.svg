<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="wr-title wr-desc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="wr-title">watermark-remover</title>
  <desc id="wr-desc">Wordmark on a navy panel. On the right, a column of Unicode codepoints and metadata block names is being consumed left to right by a scrub line, leaving faint residue behind it.</desc>

  <defs>
    <clipPath id="wr-field">
      <rect x="700" y="56" width="436" height="180"/>
    </clipPath>
    <clipPath id="wr-live">
      <rect x="892" y="56" width="244" height="180"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="#0a2026"/>

  <!-- left field: typographic -->
  <text x="64" y="98" font-size="13" letter-spacing="2.4" fill="#9fb0b8">PYTHON 3.10+ &#183; STDLIB CORE &#183; MIT</text>
  <text x="64" y="168" font-size="58" font-weight="700" letter-spacing="-1" fill="#ffffff">watermark-remover</text>
  <text x="64" y="206" font-size="17" fill="#9fb0b8">inspect and clean AI provenance signals you own</text>

  <!-- field divider -->
  <rect x="676" y="44" width="1" height="192" fill="#173038"/>

  <!-- right field: residue left of the scrub line -->
  <g clip-path="url(#wr-field)" font-size="15" fill="#234049">
    <text x="700" y="82">U+200B U+200D U+FEFF U+2060 U+00AD U+180E</text>
    <text x="700" y="116">c2pa.assertions jumbf urn:uuid cai.claim</text>
    <text x="700" y="150">xmpMM:History Iptc4xmpCore photoshop:Cred</text>
    <text x="700" y="184">EXIF.Software EXIF.ImageDescription GPS</text>
    <text x="700" y="218">PNG caBX tEXt iTXt zTXt / JPEG APP11 APP1</text>
  </g>

  <!-- right field: live signal right of the scrub line -->
  <g clip-path="url(#wr-live)" font-size="15" fill="#f05aa8">
    <text x="700" y="82">U+200B U+200D U+FEFF U+2060 U+00AD U+180E</text>
    <text x="700" y="116">c2pa.assertions jumbf urn:uuid cai.claim</text>
    <text x="700" y="150">xmpMM:History Iptc4xmpCore photoshop:Cred</text>
    <text x="700" y="184">EXIF.Software EXIF.ImageDescription GPS</text>
    <text x="700" y="218">PNG caBX tEXt iTXt zTXt / JPEG APP11 APP1</text>
  </g>

  <!-- scrub line -->
  <rect x="890" y="56" width="2" height="180" fill="#ffffff"/>
  <rect x="884" y="52" width="14" height="2" fill="#ffffff"/>
  <rect x="884" y="236" width="14" height="2" fill="#ffffff"/>

  <!-- baseline rule + layer markers -->
  <rect x="64" y="254" width="1072" height="1" fill="#173038"/>
  <g font-size="13" fill="#9fb0b8">
    <text x="64" y="280"><tspan fill="#f05aa8">A</tspan>  hidden unicode</text>
    <text x="332" y="280"><tspan fill="#f05aa8">B</tspan>  token distribution</text>
    <text x="600" y="280"><tspan fill="#f05aa8">V</tspan>  visible marks</text>
    <text x="868" y="280"><tspan fill="#f05aa8">M</tspan>  metadata + c2pa</text>
  </g>
</svg>
